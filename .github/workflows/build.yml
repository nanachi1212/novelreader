name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Lint
        run: ./gradlew :composeApp:lintDebug

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/novelreader-release.jks

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/release/composeApp-release.apk
          generate_release_notes: true

  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Desktop tests
        run: .\gradlew.bat :composeApp:desktopTest

      - name: Build Windows distributable
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\gradlew.bat :composeApp:createReleaseDistributable

      - name: Package Windows zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          Compress-Archive -Path "composeApp/build/native-dist/main-release/app/NovelReader/*" `
            -DestinationPath "NovelReader-windows-x64.zip"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovelReader-windows-x64.zip
