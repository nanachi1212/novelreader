name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests
        run: gradle :composeApp:testDebugUnitTest

      - name: Build debug APK
        run: gradle :composeApp:assembleDebug

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :composeApp:assembleRelease

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/release/composeApp-release.apk
          generate_release_notes: true

  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Windows distributable
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle :composeApp:createReleaseDistributable

      - name: Package Windows zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          Compress-Archive -Path "composeApp/build/compose/binaries/main-release/app/NovelReader/*" `
            -DestinationPath "NovelReader-windows-x64.zip"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovelReader-windows-x64.zip
