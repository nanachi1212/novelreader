name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore novelreader-release.jks \
            -alias novelreader \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass novelreader -keypass novelreader \
            -dname "CN=NovelReader, OU=Personal, O=NovelReader"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelreader-release-keystore
          path: novelreader-release.jks
